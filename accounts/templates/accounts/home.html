<!DOCTYPE html>
<html>
<head>
    <title>Accounts</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .card {
            width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            color: #333;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .icon {
            font-size: 60px;
        }

        h1 {
            color: #667eea;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            background: #667eea;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">👤</div>

        <h1>My Account</h1>

        <p>Welcome to your account profile.</p>

        <p><b>Name:</b> Student</p>

        <p><b>Role:</b> Django User</p>

        <button>View Profile</button>

    </div>

</body>
</html>
